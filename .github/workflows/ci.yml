name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'
      - run: dotnet pack Ternwire.csproj -c Release
      - run: dotnet build examples/Send/Send.csproj
      - run: dotnet test tests/Ternwire.Tests/Ternwire.Tests.csproj
